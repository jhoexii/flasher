plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.espflasher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.espflasher'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
}

tasks.register('prepareEsptool') {
    doLast {
        def root = project.rootDir
        def bundle = file('src/main/assets/esptool.bundle.js')
        if (!bundle.exists()) {
            def npm = System.getProperty('os.name').toLowerCase().contains('win') ? 'npm.cmd' : 'npm'
            exec { commandLine npm, 'install', '--no-audit', '--no-fund'; workingDir root }
            exec { commandLine npm, 'exec', '--', 'esbuild', 'node_modules/esptool-js/lib/index.js', '--bundle', '--format=iife', '--global-name=esptool', '--platform=browser', '--target=es2020', '--outfile=app/src/main/assets/esptool.bundle.js'; workingDir root }
        }
    }
}
preBuild.dependsOn(prepareEsptool)
